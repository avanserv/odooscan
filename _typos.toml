# The custom fixture modules are wrong on purpose: a misspelled field name is how a test proves
# that an unknown-field rule fires. The oracle baselines quote Odoo identifiers.
[files]
extend-exclude = ["crates/*/tests/fixtures/custom/", "tests/oracle/"]

# The spelling of a BaseModel method of Odoo 17.0.
[default.extend-identifiers]
_read_group_get_annoted_groupby = "_read_group_get_annoted_groupby"
