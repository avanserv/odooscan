[project]
site_name = "odooscan"
site_description = "A quality and security scanner for Odoo modules that checks them against an index of every module they build on."
site_url = "https://avanserv.github.io/odooscan/"
repo_url = "https://github.com/avanserv/odooscan"
repo_name = "avanserv/odooscan"
copyright = "Copyright &copy; 2026 Avanserv SRL. Not affiliated with Odoo S.A."
# A rule page's URL is derived from its code, /rules/OD203/, and findings link to it: renaming a
# page breaks every report already written.
nav = [
    { "Overview" = "index.md" },
    { "Configuration" = "configuration.md" },
    { "In CI" = "ci.md" },
    { "Series" = "series.md" },
    { "Adopting on an existing codebase" = "baseline.md" },
    { "Suppressing a finding" = "suppressing.md" },
    { "Rules" = "rules/index.md" },
]

[project.theme]
name = "avanserv"
language = "en"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.top",
    "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
