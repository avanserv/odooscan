name: CI

on:
  pull_request:
    # The default set, listed so that `edited` is not added here: pr-title.yml answers that one.
    types: [opened, synchronize, reopened]
  # The run the README badge reports.
  push:
    branches:
      - main

# A superseded push to a pull request should not keep burning minutes, so its in-progress runs are
# cancelled when a newer commit lands. A run on main is left to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default, so a job gets write access only by asking for it in its own block and
# saying there what it needs it for. No job in this file does.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every job takes its toolchain from rust-toolchain.toml: rustup installs it on the first cargo
# call, so no toolchain action is needed.
jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-machete
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete@0.9.2

      # Format, clippy and unused dependencies live here, along with the workflow audits and the
      # spelling and Markdown checks. The gitleaks hook is the one that proves nothing in this job:
      # it reads the staged diff, and nothing is staged. The Security Scan job covers the tree.
      - name: Run pre-commit
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: 0.5.5

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The fixture snapshot is the rule gate: every rule fires on its custom module and nowhere else.
      - name: Run the tests
        run: make test

  # Odoo core is correct code, so its findings are recorded in tests/oracle/ and any change to them,
  # new or fixed, fails here until the pull request records and explains it.
  oracle:
    name: Odoo core oracle (${{ matrix.series }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        series: ["18.0", "20.0"]
    env:
      SERIES: ${{ matrix.series }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Fetch the pinned Odoo core
        run: make oracle-fetch

      - name: Scan it against the recorded findings
        run: make oracle

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the dependency checkers
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2

      # Advisories come from the RustSec database at run time, so this job can turn red on main
      # with no change: that is the point of running it on every push.
      - name: Check advisories, licenses, sources and unused dependencies
        run: make deps

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pinned binary download rather than the vendor action, checked against a digest recorded
      # here. Dependabot does not see it: bump the version and its digest together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks

      # The step the gitleaks hook cannot replace: scanning the working tree is what makes a green
      # Security Scan mean there are no secrets in it. .gitleaks.toml says what is allowed past.
      - name: Scan the working tree for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --exit-code 1

  wheel:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release's most common target, built in the manylinux container like the release.
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, python: python3, bin: bin }
          # The one that differs most: native paths, and the 260-character limit on them.
          - { os: windows-latest, target: x64, python: python, bin: Scripts }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same step as in release.yml, which says why.
      - name: Allow long paths
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      # So a packaging break shows here and not on release day. No build cache: the Linux build
      # runs in a container, where the host's cache is no use.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: false

      # Exit status 1 is the expected answer: the fixture is written to trigger every rule.
      - name: Install and run it
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
          VENV_BIN: ${{ matrix.bin }}
        run: |
          "$PYTHON" -m venv "$RUNNER_TEMP/venv"
          bin="$RUNNER_TEMP/venv/$VENV_BIN"
          "$bin/pip" install --quiet dist/*.whl
          "$bin/oscn" --version
          fixtures=crates/odooscan_core/tests/fixtures
          status=0
          "$bin/oscn" check "$fixtures/custom" --addons-path "$fixtures/core" --statistics || status=$?
          test "$status" -eq 1

  # Single aggregation gate: passes if no job failed or was cancelled, and a skipped job counts as
  # a pass, exactly as GitHub treats a skipped required check. This is the one required status
  # check, so branch protection stays stable as jobs are added.
  ci-gate:
    name: CI Passed
    needs:
      - pre-commit
      - tests
      - oracle
      - deps
      - security
      - wheel
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate CI job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS_JSON"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS_JSON" >/dev/null
