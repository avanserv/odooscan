name: Release

on:
  push:
    branches:
      - main
  # Finishes a release whose build failed after Release Please tagged it: rebuilds and publishes
  # the given tag, and leaves the release pull request alone.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, such as v0.2.0
        required: true
        type: string

# Nothing by default; each job below names what it holds and why.
permissions: {}

# One at a time and never cancelled: a run interrupted between tagging and publishing would leave
# a release on GitHub that PyPI never received.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job's own token writes nothing: everything below goes through the release App's token.
    permissions:
      contents: read
    outputs:
      release_created: ${{ inputs.tag && 'true' || steps.release.outputs.release_created }}
      tag_name: ${{ inputs.tag || steps.release.outputs.tag_name }}
    steps:
      # The release App rather than the job's own token: GitHub holds the workflows of a pull
      # request that token opens until someone approves them, so the release pull request would
      # never get its CI unattended.
      - name: Generate the release App token
        if: ${{ github.event_name == 'push' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Named rather than left blank, because blank means every permission the installation
          # holds. A permission it does not hold fails the token request itself.
          permission-contents: write # the tag, the GitHub release, the lockfile commit
          permission-pull-requests: write # opens and updates the release pull request

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: ${{ github.event_name == 'push' }}
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Release Please rewrites the workspace version in Cargo.toml and knows nothing of
      # Cargo.lock, which records the same version for each workspace crate. Left alone the release
      # branch fails every `--locked` build, so the lockfile is brought back in step on the branch
      # before anyone merges it.
      - name: Checkout the release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
          # The push below is the whole reason for this checkout, so the credential stays.
          persist-credentials: true # zizmor: ignore[artipacked]

      # `--workspace` touches only the workspace crates' own entries, never a dependency's version.
      - name: Sync the lockfile
        if: ${{ steps.release.outputs.pr }}
        run: |
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the release version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock with the release version" -- Cargo.lock
          git push

  wheels:
    name: Wheel (${{ matrix.target }}${{ matrix.manylinux && format(', {0}', matrix.manylinux) || '' }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Every wheel or none: the publish job needs them all, so one failure already stops the release.
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # libgit2, which Cargo checks git dependencies out with, stops at Windows' 260-character
      # path limit unless told otherwise, and ruff's tree has longer paths.
      - name: Allow long paths
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      # No cache in a workflow that publishes: a cache is writable by any job that can reach the
      # same key.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: false

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/odooscan/
    permissions:
      id-token: write # PyPI trusted publishing: the upload is authorised by this job's identity
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false # see the note in the wheels job

      # No token anywhere: PyPI trusts this workflow in this environment for this project, and
      # exchanges the job's OIDC identity for a short-lived upload credential.
      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  # The same files PyPI received, for whoever installs from the release page: a wheel is a zip
  # archive holding the `oscn` executable.
  assets:
    name: Attach the wheels to the release
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # uploads to the release Release Please just created
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Upload with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release upload --clobber "$TAG" -- *

  # The hook repository pins the wheel by version, the way ruff-pre-commit does, so that
  # installing the hook downloads a binary instead of compiling Rust. It moves only once PyPI has
  # the version it names: a mirror tag ahead of PyPI is a hook nobody can install.
  mirror:
    name: Update odooscan-pre-commit
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Generate the release App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: odooscan-pre-commit
          permission-contents: write # the version commit and its tag

      - name: Checkout odooscan-pre-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/odooscan-pre-commit
          token: ${{ steps.app-token.outputs.token }}
          # The push below is the whole reason for this checkout, so the credential stays.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Pin the new version and tag it
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          sed -i -E "s/odooscan==[0-9A-Za-z.+-]+/odooscan==${version}/" pyproject.toml
          # Only the rev under odooscan's own repo line: the README pins other hooks too.
          sed -i -E "/avanserv\/odooscan-pre-commit/{n;s/rev: v[0-9A-Za-z.+-]+/rev: ${TAG}/}" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The mirror is seeded with the first version, so the first release has nothing to commit.
          if ! git diff --quiet; then
            git commit -am "chore: mirror odooscan ${version}"
          fi
          git tag "$TAG"
          git push origin HEAD "$TAG"
