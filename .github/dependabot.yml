# Version updates, which are a separate thing from Dependabot alerts: an alert says a dependency is
# vulnerable and stops there. Everything is grouped and weekly, and every ecosystem sets a
# seven-day cooldown, so this file never adopts a release faster than its ecosystem can withdraw
# it. The `build` prefix keeps the squash commit a conventional one that bumps no version.
version: 2
updates:
  # The one that pays for the hash pins .github/zizmor.yml requires.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # One lockfile at the workspace root covers every crate.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    # Ruff's crates come from a git tag, which Dependabot cannot order: it proposed 0.17.1 over
    # 0.17.2 and rewrote only Cargo.lock, breaking every `--locked` build. A bump is a hand edit of
    # the tag in Cargo.toml, with the golden run on Odoo core that CONTRIBUTING.md asks for.
    ignore:
      - dependency-name: "ruff_*"
    groups:
      cargo:
        patterns: ["*"]

  # The site generator, the only Python dependency: uv.lock holds it for `make site`.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docs:
        patterns: ["*"]

  # Its own pull request, never grouped with the crates: a new toolchain brings new clippy lints,
  # and the fixes for them belong with the bump.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
